# The xcodegen spec for the iOS app; the .xcodeproj is not committed. CI runs
# `xcodegen generate --spec ios/project.yml` and builds the ios/WmpSpotify.xcodeproj it writes.
name: WmpSpotify
targets:
  WmpSpotify:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # xcodegen writes a shared scheme only for targets that ask for one; CI builds -scheme WmpSpotify,
    # which builds the extension too (a dependency).
    scheme: {}
    # Embedded in PlugIns.
    dependencies:
      - target: WmpSpotifyBroadcast
        embed: true
    # Listed file by file so the generated Info.plist next to them is never a resource.
    sources:
      - path: WmpSpotify/App.swift
      - path: WmpSpotify/observer.js
        buildPhase: resources
      - path: WmpSpotify/Assets.xcassets
    info:
      path: WmpSpotify/Info.plist
      properties:
        CFBundleDisplayName: WMP Spotify
        # xcodegen's defaults are the literals "1.0" and "1": these let CI's build number through.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # The App Group holds the extension's socket and log. xcodegen writes the file (not committed) and
    # sets CODE_SIGN_ENTITLEMENTS; the group has to be on both App IDs in the portal (ios/README.md).
    entitlements:
      path: WmpSpotify/WmpSpotify.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rcircelli.wmpspotify]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rcircelli.wmpspotify
        DEVELOPMENT_TEAM: QKSF9UQ8WT
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
  # The broadcast upload extension (ios/README.md): the system's app audio to the app over a Unix socket
  # in the App Group container.
  WmpSpotifyBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WmpSpotifyBroadcast/SampleHandler.swift
    info:
      path: WmpSpotifyBroadcast/Info.plist
      properties:
        CFBundleDisplayName: WMP Spotify
        # The app's version and build number: App Store Connect wants the extension's to match.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: WmpSpotifyBroadcast/WmpSpotifyBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rcircelli.wmpspotify]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rcircelli.wmpspotify.broadcast
        # Archived only inside the app: without this the archive is a generic one that will not export.
        SKIP_INSTALL: "YES"
        DEVELOPMENT_TEAM: QKSF9UQ8WT
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "NO"
