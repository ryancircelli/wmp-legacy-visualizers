# Packages the Windows screensaver and keeps one rolling download link:
# https://github.com/ryancircelli/wmp-legacy-visualizers/releases/download/screensaver-latest/AlchemyScreensaver-win64.zip
# The zip is also a workflow artifact on every run, including workflow_dispatch from a branch.
#
# Runs on ubuntu: `deno compile --target x86_64-pc-windows-msvc` cross-compiles, so no Windows
# runner is needed.
name: screensaver-release
on:
  push:
    branches: [master]
    paths:
      - 'deno-webview/**'
      - 'deno/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.*'
      - 'tools/postbuild.js'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - 'public/**'
      - '.github/workflows/screensaver-release.yml'
  workflow_dispatch:
concurrency:
  group: screensaver-release
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # The page: TypeScript + React, built by Vite into ../dist (index.html, alchemy.html,
      # spotify-inject.js, version.json). Checks first, so a red typecheck never ships an exe.
      - name: Check and build the page
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          ls -l dist

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The WASAPI loopback helper (deno-webview/audio/) is a Windows binary, cross-compiled here
      # so the release still needs no Windows runner: rustup's windows-gnu target plus mingw's
      # linker, no MSVC and no cargo-xwin. It has to be built before the tests, because one of
      # them asserts the PE subsystem byte of the built exe.
      - name: Build the audio helper (x86_64-pc-windows-gnu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
          cd deno-webview && deno task audio
          ls -l native/alchemy-audio.exe

      - name: Test
        working-directory: deno-webview
        run: deno test -A

      # deno task compile rebuilds ../dist (npm run build) and re-runs `deno task audio` (a no-op after
      # the step above), so the packaged page and helper are always this commit's.
      - name: Compile x86_64-pc-windows-msvc
        working-directory: deno-webview
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          deno task compile
          ls -l dist/Alchemy.exe

      # Windows only runs a screensaver called .scr. Everything else in the zip is documentation
      # and the two install scripts - the executable itself is self-contained.
      - name: Assemble the zip
        run: |
          d=deno-webview/dist/AlchemyScreensaver
          mkdir -p "$d"
          mv deno-webview/dist/Alchemy.exe "$d/Alchemy.scr"
          cp deno-webview/install.ps1 deno-webview/uninstall.ps1 deno-webview/README.md "$d/"
          (cd deno-webview/dist && zip -qry "$GITHUB_WORKSPACE/AlchemyScreensaver-win64.zip" AlchemyScreensaver)
          ls -l AlchemyScreensaver-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AlchemyScreensaver-win64
          path: AlchemyScreensaver-win64.zip
          retention-days: 30

      # Rolling tag: deleted and recreated so the download URL never changes.
      - name: Update the screensaver-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One quoted line per paragraph: a heredoc would carry this step's YAML indentation
          # into the notes and render every paragraph as a code block.
          printf '%s\n' \
            "Windows x64 build of ${GITHUB_SHA::7}." \
            '' \
            'Unzip it anywhere and right-click `Alchemy.scr` > **Install**, or run `powershell -ExecutionPolicy Bypass -File .\install.ps1` (no admin rights; `-Timeout 300` for a 5 minute idle). `uninstall.ps1` restores the previous screensaver. The `.scr` is one self-contained file - nothing has to stay next to it.' \
            '' \
            '**Needs the WebView2 runtime**, which ships with Windows 11 and with current Windows 10. Nothing to install otherwise.' \
            '' \
            '**SmartScreen:** the exe is unsigned, so the first run shows "Windows protected your PC" - click *More info* > *Run anyway*. Nothing to do about that short of a code-signing certificate.' \
            '' \
            '**System audio works.** The visualizers follow whatever the speakers are playing, with no picker and no permission prompt: a 270 KB WASAPI loopback helper is unpacked beside the WebView2 DLLs and its PCM reaches the page over a local WebSocket. Apps holding the endpoint in exclusive mode are the exception - see README.md.' \
            '' \
            'Drop a `settings.json` next to the `.scr` with `{"pageUrl": "https://wmp.ryancircelli.com/"}` to load the published page instead of the embedded copy, with an automatic fallback to the embedded one when offline.' \
            > notes.md
          gh release delete screensaver-latest --yes --cleanup-tag || true
          gh release create screensaver-latest AlchemyScreensaver-win64.zip \
            --target "$GITHUB_SHA" \
            --title "Alchemy screensaver (latest)" \
            --notes-file notes.md
