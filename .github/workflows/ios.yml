# Builds the iPhone app (ios/, ios/README.md) and uploads it to TestFlight on every push to master that touches it.
# The Xcode project is generated from ios/project.yml by xcodegen; none is checked in.
# Signing is Xcode's cloud-managed signing: no certificate or profile is stored anywhere. xcodebuild signs in to
# App Store Connect with the API key (-allowProvisioningUpdates) and creates or fetches what it needs, so:
#   - the key must have the Admin role, which cloud signing needs to create the distribution certificate;
#   - the App IDs com.rcircelli.wmpspotify and com.rcircelli.wmpspotify.broadcast are registered by hand (the
#     archive step does not do it, measured 2026-09-30), and the upload
#     fails until the App Store Connect app record for that bundle id exists (made by hand, once).
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the whole AuthKey_<id>.p8 file), from App Store Connect >
# Users and Access > Integrations > App Store Connect API. The team id is not secret: it is in project.yml.
name: ios
on:
  push:
    branches: [master]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
concurrency: { group: ios, cancel-in-progress: true }
jobs:
  testflight:
    runs-on: macos-26
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      # The key stays out of every command line (printf is a shell builtin). SIGN holds the four flags both
      # xcodebuild steps need, written once; it is expanded unquoted below on purpose, as four words.
      - name: Install the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "SIGN=-allowProvisioningUpdates -authenticationKeyPath $key -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID" >> "$GITHUB_ENV"
      # TestFlight takes a build number only once per version: the run number rises with every run.
      # Signed as Apple Distribution from the start: left to itself the archive signs for development,
      # and on a fresh runner that minted a new development certificate every run until the account
      # hit its cap (ten in a day, 2026-09-30). The cloud-managed distribution certificate is reused.
      - name: Archive
        run: >-
          xcodebuild archive -project ios/WmpSpotify.xcodeproj -scheme WmpSpotify -configuration Release
          -destination 'generic/platform=iOS' -archivePath build/WmpSpotify.xcarchive
          CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGN_IDENTITY="Apple Distribution" $SIGN -quiet
      # ExportOptions.plist has destination upload: exporting is the upload to App Store Connect.
      - name: Upload to TestFlight
        run: >-
          xcodebuild -exportArchive -archivePath build/WmpSpotify.xcarchive
          -exportOptionsPlist ios/ExportOptions.plist -exportPath build/out $SIGN
