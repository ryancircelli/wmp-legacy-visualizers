# Builds the page (npm run build -> dist/) and publishes it to Cloudflare (wmp.ryancircelli.com) on every push to master.
# workflow_dispatch from any other branch checks and builds only: the deploy step is master-only.
# Secrets: CLOUDFLARE_API_TOKEN (scoped: account Workers Scripts Write; zone ryancircelli.com Zone Read +
# Workers Routes Write), CLOUDFLARE_ACCOUNT_ID, UPDATE_SIGNING_KEY (signs dist/update.json; tools/sign-update.js).
name: deploy
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.*'
      - 'tools/postbuild.js'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'tools/sign-update.js'
      # the host's sources set update.json's `host`, which tells older exes a new one is out
      - 'deno-webview/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
concurrency: { group: pages-deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, deployments: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build site
        env: { GITHUB_SHA: '${{ github.sha }}' }
        run: npm run build && ls -l dist
      # The exes take a page update only when this signature verifies (deno-webview/update.ts);
      # the key is a secret, so an unsigned or foreign manifest on the site is ignored by them.
      - name: Sign the page update manifest
        if: github.ref == 'refs/heads/master'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node tools/sign-update.js
      - name: Deploy to Cloudflare (Worker with static assets, custom domain wmp.ryancircelli.com)
        if: github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
