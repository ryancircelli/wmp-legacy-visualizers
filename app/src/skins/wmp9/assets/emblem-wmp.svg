<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- WMP-style emblem: the WMP 9 orb (glossy blue sphere, white play triangle). Original artwork. -->
  <defs>
    <radialGradient id="wmp-orb" cx="36%" cy="32%" r="78%">
      <stop offset="0" stop-color="#BFDDFF"/><stop offset="0.25" stop-color="#6BA9F5"/>
      <stop offset="0.6" stop-color="#2A6FE0"/><stop offset="1" stop-color="#12417F"/>
    </radialGradient>
    <linearGradient id="wmp-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="wmp-ball"><circle cx="128" cy="128" r="112"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="112" fill="url(#wmp-orb)"/>
  <ellipse cx="128" cy="76" rx="86" ry="50" fill="url(#wmp-gloss)" clip-path="url(#wmp-ball)"/>
  <circle cx="128" cy="128" r="110.5" fill="none" stroke="#08234F" stroke-width="5"/>
  <circle cx="128" cy="128" r="96" fill="none" stroke="#8FC4FF" stroke-opacity="0.55" stroke-width="3"/>
  <path d="M104 80 L104 176 L186 128 Z" fill="#fff"/>
</svg>
