[package]
name = "alchemy-audio"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
wasapi = "0.24.0"
# Same version wasapi already pulls in, so this adds only the WinRT bindings below (media.rs).
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Storage_Streams", "Security_Cryptography"] }

# Small and quick to start matters more than anything else here: the whole binary is embedded in
# the screensaver executable and unpacked on every first run.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
